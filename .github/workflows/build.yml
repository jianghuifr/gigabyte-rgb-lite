name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ---------------------------------------------------------------
      # 许可卫生：仓库里绝不允许出现二进制
      # （MsIo64_ENE.dll / CtiIo64.sys / AacHal_x64.dll 等属于 ENE / CTI）
      # ---------------------------------------------------------------
      - name: Guard - no binaries tracked
        shell: pwsh
        run: |
          $bad = git ls-files | Where-Object {
                    $_ -match '\.(sys|dll|exe)$' -or
                    $_ -match 'AacHal|InstDrv|MsIo64_ENE|MsIo32|CtiIo|CtiAIo|gdrv3|GhidApi|YccDrvv3|SMBCtrl'
                 }
          if ($bad) {
            Write-Host '::error::Binaries and build output must not be committed:'
            $bad | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host 'OK - no binaries tracked.'
          Write-Host ("tracked files: " + (git ls-files | Measure-Object).Count)

      # ---------------------------------------------------------------
      # 用 Windows 自带的 csc.exe 编译，不用任何 SDK
      # ---------------------------------------------------------------
      - name: Build
        shell: pwsh
        run: |
          .\build.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = '.\dist\GccLiteAll.exe'
          if (-not (Test-Path $exe)) { throw 'no build output' }

          Write-Host '--- list ---'
          & $exe list
          if ($LASTEXITCODE -ne 0) { throw 'list failed' }

          Write-Host '--- help ---'
          & $exe help | Select-Object -First 6
          if ($LASTEXITCODE -ne 0) { throw 'help failed' }

          # 必须是控制台子系统（命令行是本工具的主要接口）
          $b  = [System.IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $ss = [BitConverter]::ToUInt16($b, $pe + 24 + 68)
          Write-Host "subsystem = $ss (expect 3 = console)"
          if ($ss -ne 3) { throw 'build output is not a console-subsystem binary' }

          Write-Host '--- ARGB only (no target hardware on the runner -> should still exit 0) ---'
          & $exe --hid-only off | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "hid-only exit code $LASTEXITCODE, expected 0" }

          Write-Host '--- --quiet (must not kill the runner console) ---'
          & $exe --hid-only off --quiet | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "quiet exit code $LASTEXITCODE, expected 0" }

          # 内存通道：runner 上没有 ENE/CTI 的厂商组件，应当明确报错并返回 2。
          # 这正是我们要验证的失败路径。装了组件的机器会返回 0。
          Write-Host '--- DDR5 only (vendor SMBus component absent -> 2, or 0 if present) ---'
          & $exe --smb-only off | Out-Null
          $rc = $LASTEXITCODE
          Write-Host "exit = $rc"
          if ($rc -ne 0 -and $rc -ne 2) { throw "unexpected DDR5 exit code $rc" }

          Write-Host ''
          Write-Host 'smoke test OK'

      - name: Checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          $lines | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          $lines | ForEach-Object { Write-Host $_ }

          '' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          '## 构建产物' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          '' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: gcc-lite-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

      # ---------------------------------------------------------------
      # 打 tag 时自动发 Release
      # 只挂 exe + SHA256SUMS.txt；源码包 GitHub 会自动提供，不用自己打。
      # ---------------------------------------------------------------
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          Write-Host "publishing $tag ..."

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag exists - uploading (clobber)"
            gh release upload $tag dist/GccLiteAll.exe dist/SHA256SUMS.txt --clobber
          } else {
            gh release create $tag `
                --title "GccLite $tag" `
                --notes-file RELEASE_NOTES.md `
                dist/GccLiteAll.exe dist/SHA256SUMS.txt
          }
          if ($LASTEXITCODE -ne 0) { throw 'release publish failed' }
